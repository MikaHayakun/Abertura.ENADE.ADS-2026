<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081517">
  <meta name="robots" content="noindex, nofollow">
  <title>ENADE.ADS–2026 · Animação em tela cheia</title>
  <style>
    @font-face {font-family:Fira;src:url('/assets/FiraSans-Regular.otf');font-display:swap}
    :root {color-scheme:dark;font-family:Fira,sans-serif;background:#081517;color:#edf0e4}
    * {box-sizing:border-box}
    html,body {width:100%;height:100%;margin:0;overflow:hidden}
    .stage {position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#081517;isolation:isolate}
    .stage:fullscreen,.stage:-webkit-full-screen {width:100%;height:100%;background:#081517}
    canvas {display:block;width:100%;height:100%;object-fit:contain;background:#081517}
    @media(orientation:portrait){.stage[data-layout="mobile"] canvas{object-fit:cover}}
    a {display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 15px;border:1px solid #638574;border-radius:5px;background:#0b191aef;color:#edf0e4;font:inherit;font-size:14px;line-height:1;text-decoration:none;cursor:pointer}
    a:hover {background:#193a31;border-color:#b5d8bb}
    a:focus-visible {outline:2px solid #d4ebc7;outline-offset:4px}
    .idle {cursor:none}
    .status {position:absolute;z-index:3;bottom:max(85px,calc(env(safe-area-inset-bottom) + 75px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);margin:0;padding:12px 18px;background:#0b191af5;border:1px solid #638574;border-radius:5px;font-size:14px;line-height:1.5;text-align:center}
    [hidden] {display:none!important}
    .play-invitation {position:absolute;z-index:2;left:50%;top:max(26px,env(safe-area-inset-top));transform:translateX(-50%);isolation:isolate;perspective:900px}
    .play-reflection {position:absolute;z-index:-1;inset:-48px -76px -64px;background:radial-gradient(ellipse,#1ed760d9 0%,#1ed76088 28%,#1ed76035 48%,#1ed76000 73%);filter:blur(12px);opacity:.04;pointer-events:none}
    .play-cta {--unit:clamp(3px,.36vw,5.5px);position:relative;display:flex;padding:13px 18px 16px;min-height:54px;border:1px solid #1ed76099;border-bottom-color:#0b5b2b;border-radius:3px;background:#04110bf2;color:#1ed760;box-shadow:0 5px 0 #07391b;transform-style:preserve-3d;transition:transform 140ms ease-out;touch-action:manipulation}
    .play-cta::after {content:'';position:absolute;inset:-1px;border:1px solid #82ffad;border-radius:inherit;box-shadow:0 0 14px #1ed760,0 0 34px #1ed760c4,inset 0 0 20px #1ed7608c;pointer-events:none;opacity:.04}
    .play-cta:hover {background:#04110bf2;transform:translateY(-2px);border-color:#97ffb9}
    .play-cta:active {transform:translateY(2px)}
    .play-cta:focus-visible {outline:3px solid #1ed760;outline-offset:9px}
    .cta-light-field {position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:radial-gradient(ellipse at 50% 55%,#1ed760e6 0%,#1ed76099 40%,#1ed76030 75%,#1ed76008 100%);transform:translateZ(2px);opacity:.04;pointer-events:none}
    .cta-light-field::before {content:'';position:absolute;inset:-80% auto -80% 0;width:28%;background:linear-gradient(90deg,#a7ffc200,#c4ffd7dd,#a7ffc200);transform:translateX(-180%) skewX(-24deg);opacity:0}
    .voxel-title {position:relative;display:block;width:calc(var(--columns) * var(--unit));height:calc(7 * var(--unit));transform:translateZ(22px) rotateX(-10deg) rotateY(-3deg);transform-style:preserve-3d;pointer-events:none}
    .play-cube {position:absolute;left:calc(var(--x) * var(--unit));top:calc(var(--y) * var(--unit));width:calc(var(--unit) - .5px);height:calc(var(--unit) - .5px);transform-style:preserve-3d;opacity:0}
    .cube-face {position:absolute;inset:0;backface-visibility:hidden;background:#1a9446;transform:translateZ(calc(var(--unit) / 2))}
    .cube-top {background:#49f785;transform:rotateX(90deg) translateZ(calc(var(--unit) / 2))}
    .cube-side {background:#0b622e;transform:rotateY(90deg) translateZ(calc(var(--unit) / 2))}
    .voxel-light {position:absolute;inset:0;transform:translateZ(6px);filter:drop-shadow(0 0 2px #1ed760) drop-shadow(0 0 6px #1ed760);opacity:0;pointer-events:none}
    .voxel-light-mask {position:absolute;inset:0;background:#caffdc;mask-image:var(--letter-mask);mask-size:100% 100%;mask-repeat:no-repeat}
    .play-invitation.is-ready .play-cube {animation:cube-arrival 460ms cubic-bezier(.22,1,.36,1) var(--delay) both}
    .play-invitation.is-ready .play-reflection,.play-invitation.is-ready .cta-light-field,.play-invitation.is-ready .play-cta::after {animation:green-reflection 3.2s ease-in-out 1.5s infinite both}
    .play-invitation.is-ready .voxel-light {animation:letter-illumination 3.2s ease-in-out 1.5s infinite forwards}
    .play-invitation.is-ready .cta-light-field::before {animation:light-through-letters 3.2s ease-in-out 1.5s infinite both}
    .sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes cube-arrival {from{opacity:0;transform:translate3d(var(--dx),var(--dy),80px) rotateX(65deg) rotateY(-45deg)}to{opacity:1;transform:translate3d(0,0,0) rotateX(0) rotateY(0)}}
    @keyframes green-reflection {0%,18%,100%{opacity:.025}40%,62%{opacity:1}82%{opacity:.06}}
    @keyframes letter-illumination {0%,18%,100%{opacity:.07}40%,62%{opacity:1}82%{opacity:.12}}
    @keyframes light-through-letters {0%,18%{opacity:0;transform:translateX(-180%) skewX(-24deg)}38%{opacity:.8}62%{opacity:.8}80%,100%{opacity:0;transform:translateX(550%) skewX(-24deg)}}
    @media(max-width:740px){.play-invitation{top:max(26px,env(safe-area-inset-top))}.play-cta{padding:12px 16px 15px}}
    @media(max-height:480px) and (min-width:741px){.play-invitation{top:18px}.play-cta{--unit:3.6px;padding:11px 16px 14px;min-height:50px}}
    @media(prefers-reduced-motion:reduce){.play-invitation.is-ready .play-cube{animation:none;opacity:1;transform:none}.play-invitation.is-ready .play-reflection,.play-invitation.is-ready .cta-light-field,.play-invitation.is-ready .play-cta::after{animation:none;opacity:.65}.play-invitation.is-ready .voxel-light{animation:none;opacity:1}.play-invitation.is-ready .cta-light-field::before{animation:none;opacity:0}.play-cta{transition:none}}
    .stage[data-layout="mobile"] .play-reflection {display:none}
    .stage[data-layout="mobile"] .play-cta::after {inset:0;box-shadow:inset 0 0 14px #1ed760,inset 0 0 24px #1ed7608c}
    .stage[data-layout="mobile"] .cta-light-field {transform:none;contain:paint;isolation:isolate;clip-path:inset(0 round 3px);-webkit-clip-path:inset(0 round 3px)}
    .stage[data-layout="mobile"] .cta-light-field::before {inset:0 auto 0 0}
    .stage[data-layout="mobile"] .voxel-light {filter:drop-shadow(0 0 2px #1ed760)}
  </style>
</head>
<body>
  <main data-player="tiktok-frames" class="stage" id="stage" aria-label="Animação ENADE ADS 2026 em tela cheia">
    <canvas id="opening" width="720" height="1280" tabindex="0" role="img" aria-describedby="playback-help" aria-label="Abertura 3D vertical ENADE ADS 2026"></canvas>
    <div class="play-invitation" id="play-invitation" hidden>
      <span class="play-reflection" aria-hidden="true"></span>
      <a class="play-cta" id="play-now" href="https://enade-ads-2026.vercel.app/" aria-label="Jogar agora — abrir ENADE ADS 2026">
        <span class="cta-light-field" aria-hidden="true"></span>
        <span class="sr-only">Jogar agora</span>
        <span class="voxel-title" id="voxel-title" aria-hidden="true"></span>
      </a>
    </div>
    <p class="sr-only" id="playback-help">A animação preenche a janela. Toque para pausar ou continuar. O botão Jogar agora aparece ao final.</p>
    <p class="status" id="status" role="status" hidden></p>
  </main>
  <script type="module">
    import { createTikTokPlayer } from '/assets/tiktok-player.js';
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('opening');
    stage.dataset.layout = 'mobile';
    const status = document.getElementById('status');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const player = createTikTokPlayer(canvas, {
      manifest: '/output/tiktok-frames-v1/manifest.json',
      onTime: () => updateInvitation(),
      onError: () => { status.textContent = 'Não foi possível carregar a animação. Toque para tentar novamente.'; status.hidden = false; },
      onReady: () => { status.hidden = true; }
    });
    // The CTA keeps the approved lettering, timing and light independent of playback.
    const invitation = document.getElementById('play-invitation');
    const title = document.getElementById('voxel-title');
    const glyphs = {
      J:['00111','00010','00010','00010','10010','10010','01100'],
      o:['00000','00000','01110','10001','10001','10001','01110'],
      g:['00000','01111','10001','10001','01111','00001','01110'],
      a:['00000','00000','01110','00001','01111','10001','01111'],
      r:['00000','00000','10110','11001','10000','10000','10000']
    };
    let column = 0;
    let letter = 0;
    const cubes = document.createDocumentFragment();
    const luminousPixels = [];
    for (const character of 'Jogar agora') {
      if (character === ' ') { column += 3; continue; }
      glyphs[character].forEach((row,y) => [...row].forEach((pixel,x) => {
        if (pixel !== '1') return;
        luminousPixels.push(`<rect x="${column+x}" y="${y}" width=".9" height=".9"/>`);
        const cube = document.createElement('span');
        cube.className = 'play-cube';
        cube.style.setProperty('--x',column+x);
        cube.style.setProperty('--y',y);
        cube.style.setProperty('--delay',`${letter*.105+((x*7+y*3)%9)*.009}s`);
        cube.style.setProperty('--dx',`${(x-2)*14}px`);
        cube.style.setProperty('--dy',`${(y-3)*-11-28}px`);
        for (const face of ['cube-front','cube-top','cube-side']) {
          const surface = document.createElement('span');
          surface.className = `cube-face ${face}`;
          cube.append(surface);
        }
        cubes.append(cube);
      }));
      column += 6;
      letter++;
    }
    title.style.setProperty('--columns',column-1);
    title.append(cubes);
    // One mask illuminates all block faces without animating hundreds of paints.
    const light = document.createElement('span');
    light.className = 'voxel-light';
    const lightMask = document.createElement('span');
    lightMask.className = 'voxel-light-mask';
    const maskSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${column-1} 7">${luminousPixels.join('')}</svg>`;
    lightMask.style.setProperty('--letter-mask',`url("data:image/svg+xml,${encodeURIComponent(maskSvg)}")`);
    light.append(lightMask);
    title.append(light);
    function updateInvitation() {
      const show = player.readyState > 0 && player.currentTime >= 13;
      if (invitation.hidden === !show) return;
      invitation.hidden = !show;
      invitation.classList.toggle('is-ready',show);
    }
    updateInvitation();


    let enteredByClick = false;
    canvas.addEventListener('click', event => {
      if (event.detail > 1) return;
      const fullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fullscreen && (stage.requestFullscreen || stage.webkitRequestFullscreen)) {
        enteredByClick = true;
        if (stage.requestFullscreen) stage.requestFullscreen({navigationUI:'hide'}).catch(() => {});
        else stage.webkitRequestFullscreen();
        if (player.paused && !player.ended) player.play();
      } else {
        enteredByClick = false;
        player.paused ? player.play() : player.pause();
      }
    });
    canvas.addEventListener('dblclick', () => {
      if (enteredByClick) return;
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    });
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey || event.repeat || event.target.closest('a,button,input,textarea,select')) return;
      if (event.key === ' ' || event.key.toLowerCase() === 'k') {
        event.preventDefault(); player.paused ? player.play() : player.pause();
      } else if (event.key.toLowerCase() === 'r') { player.seek(0); player.play(); }
    });
    motion.addEventListener('change', event => { if (event.matches) player.pause(); });
    player.start(!motion.matches);
    // A small public interface also allows deterministic frame checks.
    window.tiktokOpening = player;

  </script>
</body>
</html>
